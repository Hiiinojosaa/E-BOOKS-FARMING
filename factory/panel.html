<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel E-Book Factory</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1d1f1e;--mut:#6c706b;--line:#e3e2dc;--acc:#2f5d50;--acc2:#e8f0ec;--hot:#b4472f;--hot2:#f8e9e4;--warn:#9a6a12;--warn2:#f7efdc;--ok:#2f6e3a;--ok2:#e6f2e7;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#141514;--card:#1d1f1d;--fg:#ecece6;--mut:#9b9e97;--line:#30332f;--acc:#86c2ab;--acc2:#1f2e28;--hot:#ec8f76;--hot2:#3a221b;--warn:#e0b45c;--warn2:#352a14;--ok:#8fd19a;--ok2:#1d2e20;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;font-size:16px;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--acc);font-weight:600}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--hot);color:#fff;font-size:11px;text-align:center}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:15px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.mut{color:var(--mut)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.tile{padding:10px 12px}
.tile .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
.tile.hot .v{color:var(--hot)}
.two{grid-template-columns:1fr 1fr} @media(max-width:820px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.hot{color:var(--hot);border-color:var(--hot);background:var(--hot2)}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok2)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn2)}
.chip.acc{color:var(--acc);border-color:var(--acc);background:var(--acc2)}
button.b,a.b{font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.b:hover{border-color:var(--mut)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button.d{color:var(--hot);border-color:var(--hot)}
button:disabled{opacity:.5;cursor:wait}
select,input,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.form{display:grid;gap:4px 12px;grid-template-columns:1fr 1fr} .form .full{grid-column:1/-1}
@media(max-width:640px){.form{grid-template-columns:1fr}}
.books{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.book{cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column}
.book .cv{aspect-ratio:1/1.6;background:var(--acc2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.book .cv img{width:100%;height:100%;object-fit:cover}
.book .meta{padding:10px}
.book .t{font-weight:600;margin:4px 0 6px;line-height:1.25}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font-size:12px;padding:4px 9px}
.filters button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.drawer.on{display:block}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--bg);overflow-y:auto;padding:18px 18px 60px;border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px} .kv div:nth-child(odd){color:var(--mut)}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;max-height:380px;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90vw}
.toast.err{background:var(--hot);color:#fff}
.how{border-left:3px solid var(--acc);background:var(--acc2);padding:12px 14px;border-radius:0 8px 8px 0}
.how ol{margin:6px 0 0;padding-left:18px} .how li{margin:4px 0}
.copy{display:flex;gap:6px;align-items:flex-start;margin-top:6px} .copy code{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;word-break:break-word}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.who select{width:auto}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">E-Book Factory <small id="syncinfo">…</small></div>
    <div class="who row"><span class="mut small">Soy</span><select id="who"></select></div>
    <button class="b" id="btnSync" title="Subir y bajar cambios de GitHub ahora">⟳ Sincronizar</button>
    <button class="b" id="btnTick" title="Recuperar, crear tareas siguientes, maquetar automáticamente y regenerar informes">▶ Ejecutar ciclo</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<div class="drawer" id="drawer"><div class="in" id="drawerIn"></div></div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = "__PANEL_TOKEN__";
let S = null, TAB = "home", FILTER = "ALL";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => ts ? new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "–";
function me(){ try { return localStorage.getItem("ebf_who") || ""; } catch(e){ return window._who || ""; } }
function setMe(v){ try { localStorage.setItem("ebf_who", v); } catch(e){ window._who = v; } }

const STATE_LABEL = {IDEA:"Idea",RESEARCH_PENDING:"Investigación pendiente",RESEARCHING:"Investigando",RESEARCH_COMPLETE:"Investigación hecha",BRIEFING:"Haciendo brief",BRIEF_READY:"Brief listo",WRITING_PENDING:"Por escribir",WRITING:"Escribiendo",DRAFT_COMPLETE:"Borrador hecho",TRANSLATION_PENDING:"Por traducir",TRANSLATING:"Traduciendo",TRANSLATED:"Traducido",EDITING:"Editando",EDITED:"Editado",FACT_CHECKING:"Verificando datos",FACT_CHECKED:"Datos verificados",METADATA_IN_PROGRESS:"Título y metadatos",DESIGN_PENDING:"Por diseñar",DESIGNING:"Diseñando",DESIGN_COMPLETE:"Diseño hecho",FORMATTING:"Maquetando",QC_PENDING:"Por revisar (QC)",QC:"En QC",QC_FAILED:"QC fallido",QC_PASSED:"QC superado",FIXING:"Corrigiendo",HUMAN_REVIEW:"Os toca revisar",CHANGES_REQUIRED:"Cambios pedidos",APPROVED:"Aprobado",REJECTED:"Rechazado",READY_FOR_PUBLISHING:"Listo para publicar",PUBLISHED:"Publicado",BLOCKED:"Bloqueado"};
const stateChip = s => { const c = ["HUMAN_REVIEW","BLOCKED","QC_FAILED"].includes(s)?"hot":["READY_FOR_PUBLISHING","PUBLISHED","APPROVED"].includes(s)?"ok":s==="REJECTED"?"":"acc"; return `<span class="chip ${c}">${esc(STATE_LABEL[s]||s)}</span>`; };
const ORDER_STATUS = {OPEN:["Pendiente","warn"],IN_PROGRESS:["En curso","acc"],DONE:["Hecha","ok"],REJECTED:["Rechazada","hot"],CANCELLED:["Cancelada",""]};
const ORDER_KIND = {GENERAL:"Instrucción general",NEW_BOOK:"Crear un libro",RESEARCH_IDEAS:"Buscar ideas de libros",CHANGE:"Cambiar algo de un libro",PRIORITY:"Prioridades",REPORT:"Pedir un informe"};
const STEP_LABEL = {RESEARCH:"Investigación",BRIEF:"Brief",WRITE:"Escritura",TRANSLATE:"Traducción",EDIT:"Edición",FACT_CHECK:"Verificación de datos",METADATA:"Título y metadatos",DESIGN:"Portada",FORMAT:"Maquetación",QC:"Control de calidad",FIX:"Corrección"};

function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?7000:3500); }

function editing(){
  // never wipe a half-typed form: background refreshes only update the header while the user is typing
  const a = document.activeElement;
  if(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName) && a.id !== "who") return true;
  return [...document.querySelectorAll("#view textarea, #view input")].some(el => el.value && el.type !== "number" && !el.id.startsWith("nb_words"));
}
async function load(soft){
  try { const r = await fetch("/api/state"); S = await r.json(); if(soft && editing()) renderHeader(); else render(); }
  catch(e){ $("#syncinfo").textContent = "Sin conexión con el panel (¿está abierto `python factory.py panel`?)"; }
}
async function act(payload, btn){
  if(!me()){ toast("Elige primero quién eres (arriba a la derecha)", true); return null; }
  if(btn) btn.disabled = true;
  try {
    const r = await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Panel-Token":TOKEN},body:JSON.stringify({...payload,by:me()})});
    const d = await r.json();
    if(!r.ok || d.error){ toast(d.error || "Error", true); return null; }
    const s = d.sync && d.sync.result;
    toast("Hecho" + (s==="OK" ? " · subido a GitHub" : s && s!=="desactivado" ? ` · sync: ${s}` : ""));
    await load(); return d;
  } catch(e){ toast("Error: "+e, true); return null; }
  finally { if(btn) btn.disabled = false; }
}

function attention(){
  const items = [];
  S.books.filter(b=>b.status==="HUMAN_REVIEW").forEach(b=>items.push({k:"rev",b,txt:`<b>${esc(b.title)}</b> está listo para que lo reviséis`,btn:`<button class="b p" onclick="openBook('${b.id}')">Revisar</button>`}));
  S.books.filter(b=>b.status==="BRIEF_READY"&&!b.brief_approved).forEach(b=>items.push({txt:`Brief de <b>${esc(b.title)}</b> (tema sensible) espera aprobación`,btn:`<button class="b" onclick="openBook('${b.id}')">Ver</button>`}));
  S.tasks.filter(t=>t.status==="BLOCKED").forEach(t=>items.push({txt:`Tarea bloqueada: ${esc(STEP_LABEL[t.type]||t.type)} de ${esc(t.book_id)}<br><span class="small mut">${esc((t.error||"").slice(0,160))}</span>`,btn:`<button class="b" onclick="unblock('${t.task_id}',this)">Desbloquear</button>`}));
  S.decisions.forEach(d=>items.push({txt:`Pregunta de un agente: ${esc(d.question)}`,btn:`<button class="b" onclick="go('dec')">Responder</button>`}));
  return items;
}

const TABS = [["home","Inicio"],["books","Libros"],["orders","Órdenes a los agentes"],["dec","Decisiones"],["agents","Agentes"],["log","Actividad"]];
function renderTabs(){
  const att = attention().length, dec = S.decisions.length;
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="${TAB===k?"on":""}" onclick="go('${k}')">${l}${k==="home"&&att?`<span class="n">${att}</span>`:""}${k==="dec"&&dec?`<span class="n">${dec}</span>`:""}</button>`).join("");
}
function go(t){ TAB=t; render(); window.scrollTo(0,0); }

function renderHeader(){
  const sy = S.sync;
  $("#syncinfo").textContent = sy.enabled ? `GitHub: ${sy.result==="OK"?"sincronizado":sy.result} · ${fmt(sy.at)}` : "Sincronización con GitHub desactivada";
  renderTabs();
}
function render(){
  if(!S) return;
  const sel = $("#who");
  sel.innerHTML = `<option value="">— elige —</option>` + S.partners.map(p=>`<option ${me()===p?"selected":""}>${esc(p)}</option>`).join("");
  renderHeader();
  ({home:vHome,books:vBooks,orders:vOrders,dec:vDec,agents:vAgents,log:vLog})[TAB]();
}

function vHome(){
  const g = S.groups, hot = ["HUMAN REVIEW","BLOCKED","FAILED"];
  const att = attention();
  const openOrders = S.orders.filter(o=>["OPEN","IN_PROGRESS"].includes(o.status));
  $("#view").innerHTML = `
  <h2>Cadena de producción</h2>
  <div class="grid tiles">${Object.entries(g).map(([k,v])=>`<div class="card tile ${hot.includes(k)&&v?"hot":""}"><div class="v">${v}</div><div class="l">${esc(k)}</div></div>`).join("")}</div>
  <div class="grid two" style="margin-top:14px">
    <div><h2>Necesita vuestra atención</h2><div class="list">${att.length?att.map(i=>`<div class="card row"><div>${i.txt}</div>${i.btn}</div>`).join(""):`<div class="card empty">Nada pendiente. La fábrica puede seguir sola.</div>`}</div></div>
    <div><h2>Órdenes abiertas a los agentes</h2><div class="list">${openOrders.length?openOrders.slice(0,6).map(orderCard).join(""):`<div class="card empty">No hay órdenes abiertas. <a href="#" onclick="go('orders');return false">Dar una orden</a></div>`}</div>
    <h2>Últimos 7 días</h2><div class="card kv">
      <div>Libros creados</div><div>${S.week.books_created}</div><div>Libros terminados</div><div>${S.week.books_completed}</div>
      <div>Tareas hechas</div><div>${S.week.tasks_completed}</div><div>Tareas fallidas</div><div>${S.week.tasks_failed}</div></div></div>
  </div>`;
}

function vBooks(){
  const groups = ["ALL",...Object.keys(S.groups).filter(k=>k!=="TOTAL BOOKS"&&S.groups[k])];
  const list = S.books.filter(b=>FILTER==="ALL"||b.group===FILTER);
  $("#view").innerHTML = `
  <div class="row"><h2>Libros (${S.books.length})</h2><button class="b p" onclick="newBookForm()">+ Nueva idea de libro</button></div>
  <div class="filters">${groups.map(k=>`<button class="b ${FILTER===k?"on":""}" onclick="FILTER='${k}';vBooks()">${k==="ALL"?"Todos":esc(k)}</button>`).join("")}</div>
  <div class="grid books">${list.map(b=>`
    <div class="card book" onclick="openBook('${b.id}')">
      <div class="cv">${b.has_cover?`<img loading="lazy" src="/files/BOOKS/${b.id}/design/cover.png?${encodeURIComponent(b.updated_at)}" alt="">`:"Sin portada todavía"}</div>
      <div class="meta"><div class="small mut mono">${esc(b.id)} · ${esc(b.language)}</div><div class="t">${esc(b.title)}</div>${stateChip(b.status)}
      ${b.priority!=="NORMAL"?` <span class="chip ${b.priority==="LOW"?"":"warn"}">${esc(b.priority)}</span>`:""}${b.assigned_agent?`<div class="small mut" style="margin-top:6px">Trabajando: ${esc(b.assigned_agent)}</div>`:""}</div>
    </div>`).join("")||`<div class="empty">No hay libros en este grupo.</div>`}</div>`;
}

function newBookForm(){
  openDrawer(`<h2>Nueva idea de libro</h2>
  <p class="mut small">Queda como IDEA. Cuando haya hueco en la fábrica, un agente empezará a investigarla.</p>
  <div class="form">
    <div class="full"><label>Tema</label><input id="nb_topic" placeholder="p. ej. Meal prep for busy parents"></div>
    <div><label>Idioma</label><select id="nb_lang">${S.languages.map(l=>`<option>${l}</option>`).join("")}</select></div>
    <div><label>Prioridad</label><select id="nb_prio"><option>NORMAL</option><option>HIGH</option><option>CRITICAL</option><option>LOW</option></select></div>
    <div><label>Nicho</label><input id="nb_niche"></div>
    <div><label>Público</label><input id="nb_aud"></div>
    <div><label>Palabras objetivo</label><input id="nb_words" type="number" value="6000"></div>
    <div><label>Crear también en</label><select id="nb_tl" multiple size="3">${S.languages.map(l=>`<option>${l}</option>`).join("")}</select></div>
    <div class="full"><label>Notas para los agentes</label><textarea id="nb_notes"></textarea></div>
  </div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="b" onclick="closeDrawer()">Cancelar</button><button class="b p" onclick="createBook(this)">Crear idea</button></div>`);
}
async function createBook(btn){
  const tl=[...$("#nb_tl").selectedOptions].map(o=>o.value);
  const d = await act({action:"new_book",topic:$("#nb_topic").value,language:$("#nb_lang").value,priority:$("#nb_prio").value,niche:$("#nb_niche").value,audience:$("#nb_aud").value,words:$("#nb_words").value,target_languages:tl,notes:$("#nb_notes").value},btn);
  if(d) closeDrawer();
}

async function openBook(id){
  openDrawer(`<p class="mut">Cargando…</p>`);
  const r = await fetch("/api/book/"+encodeURIComponent(id)); const d = await r.json();
  if(d.error){ $("#drawerIn").innerHTML = `<p>${esc(d.error)}</p>`; return; }
  const b = d.book, f = p => `/files/BOOKS/${b.id}/${p}`;
  const price = b.price_suggested ? `${b.price_suggested.amount} ${b.price_suggested.currency} (${b.price_suggested.basis})` : "–";
  let actions = "";
  if(b.status==="HUMAN_REVIEW") actions = `
    <div class="card"><h2>Vuestra decisión</h2>
      <div class="form"><div><label>Autor</label><input id="ap_author" value="${esc(b.author==="TBD-PEN-NAME"?S.default_author:b.author)}"></div>
      <div><label>Precio (vacío = sugerido)</label><input id="ap_price" placeholder="${esc(b.price_suggested?b.price_suggested.amount:"")}"></div>
      <div class="full"><label>Notas</label><textarea id="ap_notes" placeholder="Opcional al aprobar. Obligatorio si pedís cambios: explicad qué cambiar."></textarea></div>
      <div><label>Si pedís cambios, rehacer desde</label><select id="ap_restart">${S.steps.filter(s=>s!=="FORMAT").map(s=>`<option value="${s}" ${s==="EDIT"?"selected":""}>${esc(STEP_LABEL[s]||s)}</option>`).join("")}</select></div></div>
      <div class="row" style="margin-top:12px;justify-content:flex-start">
        <button class="b p" onclick="decideBook('approve','${b.id}',this)">✓ Aprobar</button>
        <button class="b" onclick="decideBook('request_changes','${b.id}',this)">↺ Pedir cambios</button>
        <button class="b d" onclick="decideBook('reject','${b.id}',this)">✕ Rechazar</button></div></div>`;
  else if(b.status==="BRIEF_READY" && !b.brief_approved) actions = `<div class="card row"><div>Tema sensible: el brief necesita vuestra aprobación antes de escribir.<br><a class="small" href="${f("brief.md")}" target="_blank">Leer brief</a></div><button class="b p" onclick="act({action:'approve_brief',id:'${b.id}'},this).then(()=>openBook('${b.id}'))">Aprobar brief</button></div>`;
  else if(b.status==="READY_FOR_PUBLISHING") actions = `<div class="card"><h2>Tras subirlo a la tienda</h2><div class="form"><div><label>Plataforma</label><input id="mp_plat" value="KDP"></div><div><label>URL</label><input id="mp_url"></div></div>
    <div class="row" style="margin-top:10px;justify-content:flex-start"><a class="b" href="${f(b.files.publishing_package+"/CHECKLIST.md")}" target="_blank">Ver checklist</a><button class="b p" onclick="act({action:'mark_published',id:'${b.id}',platform:$('#mp_plat').value,url:$('#mp_url').value},this).then(()=>openBook('${b.id}'))">Marcar como publicado</button></div></div>`;
  const files = d.files.filter(p=>/\.(md|pdf|epub|png|jpg|json)$/.test(p) && !p.startsWith("releases/")||/PUBLISHING_PACKAGE\/[^/]+$/.test(p));
  $("#drawerIn").innerHTML = `
  <div class="row"><div><div class="small mut mono">${esc(b.id)} · v${esc(b.version)}</div><h2 style="margin:4px 0">${esc(b.title)}</h2><div class="mut">${esc(b.subtitle||"")}</div></div><button class="b" onclick="closeDrawer()">Cerrar</button></div>
  <div class="grid two" style="margin:14px 0;grid-template-columns:150px 1fr">
    <div>${(d.files.includes("design/cover.png"))?`<img src="${f("design/cover.png")}?${encodeURIComponent(b.updated_at)}" style="width:100%;border-radius:6px;border:1px solid var(--line)">`:`<div class="card empty">Sin portada</div>`}</div>
    <div class="kv"><div>Estado</div><div>${stateChip(b.status)}</div><div>Idioma / mercado</div><div>${esc(b.language)} / ${esc(b.market)}</div>
      <div>Autor</div><div>${esc(b.author)}</div><div>QC</div><div>${esc(b.qc_status||"–")}</div><div>Páginas</div><div>${esc(b.page_count||"–")}</div>
      <div>Precio sugerido</div><div>${esc(price)}</div><div>Riesgo</div><div>${esc(b.risk_level)}</div>
      <div>Prioridad</div><div><select style="width:auto" onchange="act({action:'set_priority',id:'${b.id}',priority:this.value})">${["CRITICAL","HIGH","NORMAL","LOW"].map(p=>`<option ${p===b.priority?"selected":""}>${p}</option>`).join("")}</select></div>
      <div>Otra edición</div><div class="row" style="justify-content:flex-start"><select id="tr_lang" style="width:auto">${S.languages.filter(l=>l!==b.language).map(l=>`<option>${l}</option>`).join("")}</select><button class="b" onclick="act({action:'translate',id:'${b.id}',to:$('#tr_lang').value},this)">Crear</button></div>
      ${b.translated_from?`<div>Traducción de</div><div class="mono">${esc(b.translated_from)}</div>`:""}
    </div></div>
  ${actions}
  ${b.flags.length?`<h2>Avisos</h2><div class="list">${b.flags.map(x=>`<div class="card small"><span class="chip warn">${esc(x.level)}</span> ${esc(x.message)}</div>`).join("")}</div>`:""}
  <h2>Archivos</h2><div class="card small">${files.map(p=>`<div><a href="${f(p)}" target="_blank">${esc(p)}</a></div>`).join("")||"–"}</div>
  ${d.review?`<h2>Ficha de revisión</h2><pre>${esc(d.review)}</pre>`:""}
  <h2>Historial</h2><div class="card wrap"><table><tr><th>Cuándo</th><th>Cambio</th><th>Quién</th><th>Acción</th></tr>
  ${d.history.slice().reverse().map(h=>`<tr><td class="mono">${fmt(h.ts)}</td><td>${esc(STATE_LABEL[h.from]||h.from||"–")} → ${esc(STATE_LABEL[h.to]||h.to)}</td><td class="mono">${esc(h.agent)}</td><td class="small">${esc(h.action)}${h.note?`<div class="mut">${esc(String(h.note).slice(0,140))}</div>`:""}</td></tr>`).join("")}</table></div>`;
}
async function decideBook(kind,id,btn){
  const notes = $("#ap_notes").value.trim();
  if(kind==="request_changes" && !notes){ toast("Explica en Notas qué hay que cambiar", true); return; }
  if(kind==="reject" && !confirm("¿Rechazar este libro? Saldrá de la cadena.")) return;
  const p = kind==="approve" ? {action:"approve",id,author:$("#ap_author").value,price:$("#ap_price").value,notes}
          : kind==="request_changes" ? {action:"request_changes",id,notes,restart_at:$("#ap_restart").value} : {action:"reject",id,notes};
  if(await act(p,btn)) openBook(id);
}

function orderCard(o){
  const [lab,cls] = ORDER_STATUS[o.status]||[o.status,""];
  return `<div class="card"><div class="row"><div><span class="chip ${cls}">${lab}</span> <span class="small mut">${esc(ORDER_KIND[o.kind]||o.kind)} · ${esc(o.id)} · ${esc(o.by)} · ${fmt(o.created_at)}</span></div>
    ${o.status==="OPEN"?`<button class="b" onclick="act({action:'order_cancel',id:'${o.id}'},this)">Cancelar</button>`:""}</div>
    <div style="margin-top:6px">${esc(o.text)}</div>
    ${o.target_agent||o.book_id?`<div class="small mut" style="margin-top:4px">${o.target_agent?"Para: "+esc(o.target_agent):"Para: cualquier agente"}${o.book_id?" · Libro: "+esc(o.book_id):""}</div>`:""}
    ${o.taken_by?`<div class="small mut">Atendida por ${esc(o.taken_by)}</div>`:""}
    ${o.result?`<div class="small" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><b>Respuesta:</b> ${esc(o.result)}</div>`:""}</div>`;
}
function vOrders(){
  const realAgents = S.agents.filter(a=>a.owner!=="SYSTEM"&&a.owner!=="test");
  $("#view").innerHTML = `
  <div class="how"><b>Cómo funcionan las órdenes.</b> Escribís aquí lo que queréis, en lenguaje normal. Se guarda en el proyecto y se sube a GitHub.
  Cada vez que un agente empieza a trabajar, lo primero que hace es leer las órdenes pendientes, cumplirlas y dejar aquí su respuesta.
  Las órdenes nunca pueden saltarse las reglas básicas: un agente no publicará, no comprará y no inventará datos aunque se lo pidáis.</div>
  <div class="grid two" style="margin-top:14px">
  <div class="card"><h2>Nueva orden</h2><div class="form">
    <div><label>Tipo</label><select id="or_kind">${S.order_kinds.map(k=>`<option value="${k}">${esc(ORDER_KIND[k]||k)}</option>`).join("")}</select></div>
    <div><label>Prioridad</label><select id="or_prio"><option>NORMAL</option><option>HIGH</option><option>LOW</option></select></div>
    <div><label>Para</label><select id="or_target"><option value="">Cualquier agente</option>${realAgents.map(a=>`<option>${esc(a.agent_id)}</option>`).join("")}</select></div>
    <div><label>Libro (opcional)</label><select id="or_book"><option value="">—</option>${S.books.map(b=>`<option value="${b.id}">${esc(b.id)} · ${esc(b.title.slice(0,40))}</option>`).join("")}</select></div>
    <div class="full"><label>Qué queréis</label><textarea id="or_text" placeholder="Ejemplos:&#10;· Busca 3 ideas de libros para Navidad 2026 en inglés (EE. UU.)&#10;· Haz la portada de EB-000004 más llamativa&#10;· Prioriza los libros en español esta semana"></textarea></div>
  </div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="b p" onclick="sendOrder(this)">Enviar orden</button></div></div>
  <div><h2>Órdenes</h2><div class="list">${S.orders.length?S.orders.map(orderCard).join(""):`<div class="card empty">Todavía no hay órdenes.</div>`}</div></div></div>`;
}
async function sendOrder(btn){
  const d = await act({action:"order_new",kind:$("#or_kind").value,priority:$("#or_prio").value,target:$("#or_target").value,book:$("#or_book").value,text:$("#or_text").value},btn);
  if(d){ $("#or_text").value = ""; vOrders(); }
}

function vDec(){
  $("#view").innerHTML = `<h2>Preguntas de los agentes</h2>
  <p class="mut small">Cuando un agente encuentra algo que solo vosotros podéis decidir (precio, nicho dudoso, tema sensible…), os lo pregunta aquí y sigue con otra tarea.</p>
  <div class="list">${S.decisions.length?S.decisions.map(d=>`<div class="card"><div class="small mut">${esc(d.id)} · ${esc(d.asked_by)} · ${fmt(d.asked_at)}${d.book_id?" · "+esc(d.book_id):""}</div>
    <div style="margin:6px 0 10px"><b>${esc(d.question)}</b></div>
    <div class="row" style="justify-content:flex-start">${(d.options||[]).map(o=>`<button class="b" onclick="act({action:'decide',id:'${d.id}',answer:${esc(JSON.stringify(o))}},this)">${esc(o)}</button>`).join("")}</div>
    <div class="copy"><input id="ans_${d.id}" placeholder="Otra respuesta…"><button class="b p" onclick="act({action:'decide',id:'${d.id}',answer:$('#ans_${d.id}').value},this)">Responder</button></div></div>`).join(""):`<div class="card empty">No hay preguntas pendientes.</div>`}</div>`;
}

function vAgents(){
  const human = S.agents.filter(a=>a.owner!=="SYSTEM");
  const prompt = id => `Trabaja como agente ${id} de la E-Book Factory siguiendo PROMPTS/WORKER.md`;
  $("#view").innerHTML = `
  <div class="how"><b>Cómo se ponen a trabajar los agentes.</b> Un agente es una sesión de Claude abierta en la carpeta del proyecto.
  <ol><li><b>A mano:</b> abre Claude Code en la carpeta del proyecto y pega la frase del agente (botón "Copiar"). Trabaja hasta vaciar la cola o hacer 12 tareas.</li>
  <li><b>Con horario:</b> se programa una tarea en la app de Claude (p. ej. cada 3 horas) que lanza esa misma frase. Pedídselo a Claude: "programa el agente S1-CLAUDE-001 cada 3 horas".</li>
  <li><b>Dani:</b> igual, pero en su ordenador, con su cuenta y su ID (DANI-AGENT-001). Los dos trabajáis sobre el mismo repo de GitHub.</li></ol>
  <div class="small" style="margin-top:6px">Este panel no lanza agentes: les deja órdenes y os muestra lo que hacen. Si un agente se corta (cuota, cierre), su tarea vuelve sola a la cola.</div></div>
  <h2>Agentes registrados</h2><div class="card wrap"><table><tr><th>Agente</th><th>De</th><th>Estado</th><th>Tarea actual</th><th>Visto por última vez</th><th>Arrancarlo a mano</th></tr>
  ${human.map(a=>`<tr><td class="mono">${esc(a.agent_id)}</td><td>${esc(a.owner)}</td><td><span class="chip ${a.status==="BUSY"?"acc":a.status==="OFFLINE"?"":"ok"}">${esc(a.status)}</span></td><td class="mono">${esc(a.current_task||"–")}</td><td class="mono">${fmt(a.last_seen)}</td>
  <td><button class="b" onclick="copyTxt(${esc(JSON.stringify(prompt(a.agent_id)))})">Copiar frase</button></td></tr>`).join("")}</table></div>
  <h2>Añadir un agente nuevo (p. ej. de Dani)</h2><div class="card small">En su ordenador, dentro del proyecto: <div class="copy"><code>python factory.py agent register --id DANI-AGENT-001 --owner DANI --model claude</code><button class="b" onclick="copyTxt('python factory.py agent register --id DANI-AGENT-001 --owner DANI --model claude')">Copiar</button></div>
  Después, en Claude Code: <div class="copy"><code>${esc(prompt("DANI-AGENT-001"))}</code><button class="b" onclick="copyTxt(${esc(JSON.stringify(prompt("DANI-AGENT-001")))})">Copiar</button></div></div>
  <h2>Tareas en curso y en cola</h2><div class="card wrap"><table><tr><th>Tarea</th><th>Libro</th><th>Paso</th><th>Estado</th><th>Agente</th><th>Reintentos</th></tr>
  ${S.tasks.map(t=>`<tr><td class="mono">${esc(t.task_id)}</td><td class="mono">${esc(t.book_id)}</td><td>${esc(STEP_LABEL[t.type]||t.type)}</td><td>${esc(t.status)}</td><td class="mono">${esc(t.assigned_agent||"–")}</td><td>${t.retry_count}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">Cola vacía</td></tr>`}</table></div>`;
}
function copyTxt(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copiado"),()=>prompt("Copia esto:",t)); }

const EV = {BOOK_CREATED:e=>`Nuevo libro ${e.book_id}: ${e.topic||""}`,STATE_CHANGE:e=>`${e.book_id}: ${STATE_LABEL[e.frm]||e.frm} → ${STATE_LABEL[e.to]||e.to}`,TASK_DONE:e=>`${e.agent} terminó ${STEP_LABEL[e.step]||e.step} de ${e.book_id}`,TASK_FAILED:e=>`Falló ${e.task_id} (${e.book_id}): ${String(e.error||"").slice(0,120)}`,TASK_BLOCKED:e=>`Bloqueada ${e.task_id} (${e.book_id})`,TASK_CLAIMED:e=>`${e.agent} empezó ${STEP_LABEL[e.step]||e.step} de ${e.book_id}`,HUMAN_DECISION:e=>`${e.by}: ${e.decision} en ${e.book_id}`,ORDER_CREATED:e=>`${e.by} dio la orden ${e.order}`,ORDER_UPDATED:e=>`${e.by} marcó ${e.order} como ${e.status}`,PACKAGE_READY:e=>`Paquete listo: ${e.book_id} v${e.version}`,DECISION_ASKED:e=>`${e.by} pregunta (${e.decision})`,DECISION_ANSWERED:e=>`${e.by} respondió ${e.decision}`};
function vLog(){
  $("#view").innerHTML = `<h2>Actividad reciente</h2><div class="card wrap"><table>${S.events.filter(e=>!["ORCHESTRATE","RECOVER","AGENT_REGISTERED","TASK_CREATED"].includes(e.type)).map(e=>`<tr><td class="mono" style="white-space:nowrap">${fmt(e.ts)}</td><td>${esc((EV[e.type]||(x=>x.type))(e))}</td></tr>`).join("")||`<tr><td class="empty">Sin actividad</td></tr>`}</table></div>`;
}

function openDrawer(h){ $("#drawerIn").innerHTML=h; $("#drawer").classList.add("on"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); }
async function unblock(task,btn){ const note = prompt("Nota (qué se ha arreglado):",""); if(note===null) return; await act({action:"unblock",task,note},btn); }
$("#drawer").addEventListener("click",e=>{ if(e.target.id==="drawer") closeDrawer(); });
$("#who").addEventListener("change",e=>{ setMe(e.target.value); toast(e.target.value?`Hola, ${e.target.value}`:"Elige quién eres"); });
$("#btnSync").addEventListener("click",e=>act({action:"sync"},e.target));
$("#btnTick").addEventListener("click",e=>act({action:"tick"},e.target));
load(); setInterval(()=>{ if(!$("#drawer").classList.contains("on")) load(true); }, 20000);
</script>
