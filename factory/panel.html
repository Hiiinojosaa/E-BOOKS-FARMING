<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Book Factory</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--soft:#efece5;--fg:#1f2321;--mut:#6d716c;--line:#e2dfd7;
  --acc:#2f5d50;--acc-fg:#ffffff;--acc-soft:#e3eee9;
  --hot:#c0492f;--hot-soft:#fbe9e3;--gold:#a8741a;--gold-soft:#f8eed9;--ok:#2f7a45;--ok-soft:#e3f2e6;
  --me:#2f5d50;--me-fg:#fff;--other:#ffffff;--agent:#eef2f7;--agent-line:#d7dfea;
  --r:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131513;--card:#1c1f1c;--soft:#232723;--fg:#ecebe6;--mut:#9da19b;--line:#30342f;
  --acc:#7fbfa6;--acc-fg:#10201a;--acc-soft:#1d2d27;--hot:#ef8f76;--hot-soft:#38211a;--gold:#e1b866;--gold-soft:#332917;--ok:#8fd3a0;--ok-soft:#1b2e21;
  --me:#3f7a68;--me-fg:#fff;--other:#232723;--agent:#1f2530;--agent-line:#2e3747;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.big{padding:13px 20px;font-size:16px;border-radius:12px}
.btn.danger{color:var(--hot);border-color:var(--hot)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:wait}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}

/* ---------- login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:min(560px,100%);text-align:center}
.logo{font-size:30px;font-weight:750;letter-spacing:-.02em}
.logo span{color:var(--acc)}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 8px}
.profile{cursor:pointer;padding:26px 14px;text-align:center;border:2px solid var(--line)}
.profile:hover,.profile.sel{border-color:var(--acc)}
.avatar{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;background:var(--acc-soft);color:var(--acc)}
.avatar.sm{width:32px;height:32px;font-size:13px;flex:none}
.avatar.bot{background:var(--agent);color:var(--fg);border:1px solid var(--agent-line)}
.pin-step{margin-top:18px;text-align:left}
.pin{font-size:26px;letter-spacing:.5em;text-align:center}

/* ---------- shell */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.top .logo{font-size:19px;margin-right:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.on{background:#3fae5c;box-shadow:0 0 0 0 rgba(63,174,92,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,174,92,.55)}70%{box-shadow:0 0 0 8px rgba(63,174,92,0)}100%{box-shadow:0 0 0 0 rgba(63,174,92,0)}}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:6px}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--mut);font-weight:550;border-bottom:3px solid transparent;font-size:15px}
nav.tabs button.on{color:var(--fg);border-color:var(--acc)}
.badge{display:inline-block;min-width:19px;height:19px;line-height:19px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;text-align:center;padding:0 5px;margin-left:5px;vertical-align:1px}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:30px 0 12px}
@media(max-width:640px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:0 4px;z-index:10}
  nav.tabs button{padding:10px 6px 12px;font-size:13px;border-bottom:0;border-top:3px solid transparent}
  nav.tabs button.on{border-top-color:var(--acc)}
  main{padding-bottom:110px}
}

/* ---------- today */
.now{display:flex;flex-direction:column;gap:12px}
.worker{display:flex;gap:14px;align-items:center}
.worker .what{flex:1;min-width:0}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .6s}
.need{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--gold)}
.need.hot{border-left-color:var(--hot)}
.need .txt{flex:1;min-width:220px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.counts{grid-template-columns:repeat(2,1fr)}}
.count{cursor:pointer;text-align:left}
.count .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed .it:last-child{border-bottom:0}
.feed .when{color:var(--mut);font-size:12px;white-space:nowrap;min-width:64px}

/* ---------- library */
.shelf-head{display:flex;align-items:baseline;gap:10px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.bk{cursor:pointer;background:none;border:0;padding:0;text-align:left}
.cover{aspect-ratio:1/1.6;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.08);transition:transform .15s;background:var(--soft);position:relative}
.bk:hover .cover{transform:translateY(-3px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-weight:650;font-size:15px;line-height:1.2}
.cover .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff}
.bk .t{font-weight:600;margin-top:10px;font-size:14px;line-height:1.3}
.bk .s{font-size:12px;color:var(--mut);margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input{max-width:320px}

/* ---------- book modal */
.modal{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px}
.sheet{background:var(--bg);border-radius:18px;width:min(940px,100%);padding:24px;position:relative}
.close{position:absolute;top:14px;right:14px}
.bookhead{display:grid;grid-template-columns:200px 1fr;gap:24px}
@media(max-width:640px){.bookhead{grid-template-columns:1fr}.bookhead .cover{max-width:200px}}
.journey{display:flex;gap:0;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:76px;text-align:center;position:relative;font-size:11px;color:var(--mut)}
.step:before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:3px;background:var(--line)}
.step:first-child:before{display:none}
.step .c{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--line);margin:0 auto 6px;position:relative;z-index:1}
.step.done .c{background:var(--acc);border-color:var(--acc)} .step.done:before,.step.cur:before{background:var(--acc)}
.step.cur .c{border-color:var(--acc);background:var(--card);box-shadow:0 0 0 4px var(--acc-soft)}
.step.cur{color:var(--fg);font-weight:650}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media(max-width:640px){.decide{grid-template-columns:1fr}}
details{margin-top:18px} summary{cursor:pointer;color:var(--mut);font-weight:550}
.hist{font-size:13px} .hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.files a{display:block;padding:4px 0;font-size:14px}

/* ---------- chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:420px}
@media(max-width:640px){.chatwrap{height:calc(100vh - 200px)}}
.msgs{flex:1;overflow-y:auto;padding:6px 2px 14px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:9px;max-width:82%;align-items:flex-end}
.m .bub{padding:10px 13px;border-radius:16px;background:var(--other);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.m .who{font-size:12px;color:var(--mut);margin:0 0 3px 4px}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .bub{background:var(--me);color:var(--me-fg);border-color:var(--me);border-bottom-right-radius:5px}
.m.me .who{text-align:right;margin:0 4px 3px 0}
.m.agent .bub{background:var(--agent);border-color:var(--agent-line);border-bottom-left-radius:5px}
.m.partner .bub{border-bottom-left-radius:5px}
.m .meta{font-size:11px;color:var(--mut);margin-top:3px}
.m.me .meta{text-align:right}
.sys{align-self:center;font-size:12px;color:var(--mut);background:var(--soft);padding:5px 12px;border-radius:20px;max-width:90%;text-align:center}
.ev{align-self:center;font-size:12px;color:var(--mut)}
.day{align-self:center;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:8px 0}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.composer{border-top:1px solid var(--line);padding-top:12px}
.to{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px}
.to button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mut)}
.to button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.sendrow{display:flex;gap:8px;align-items:flex-end}
.sendrow textarea{min-height:48px;max-height:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.waiting{font-size:12px;color:var(--gold);margin-bottom:6px}

/* ---------- more */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block}
.status.busy{background:var(--ok-soft);color:var(--ok)} .status.idle{background:var(--soft);color:var(--mut)} .status.off{background:var(--hot-soft);color:var(--hot)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 42px;position:relative;border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center}
code.copy{display:block;background:var(--soft);padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{color:var(--mut);font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--hot);color:#fff}
@media(max-width:640px){.toast{bottom:84px}}
.empty{color:var(--mut);padding:8px 0}
</style>
</head>
<body>

<!-- =============== LOGIN =============== -->
<section id="login" class="hidden">
  <div class="login-box">
    <div class="logo">E-Book <span>Factory</span></div>
    <div class="mut">¿Quién eres?</div>
    <div class="profiles" id="profiles"></div>
    <div class="pin-step card hidden" id="pinStep">
      <div id="pinTitle" style="font-weight:600"></div>
      <div id="nameRow" class="hidden"><label>¿Cómo quieres que te llamemos?</label><input id="loginName" maxlength="40" autocomplete="off"></div>
      <label id="pinLabel">PIN</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <div class="tiny mut" id="pinHelp" style="margin-top:6px"></div>
      <button class="btn primary big" style="width:100%;margin-top:14px;justify-content:center" id="loginBtn">Entrar</button>
    </div>
    <p class="tiny mut" style="margin-top:22px">El PIN se guarda solo en este ordenador, nunca en GitHub.</p>
  </div>
</section>

<!-- =============== APP =============== -->
<section id="app" class="hidden">
  <header>
    <div class="top">
      <div class="logo">E-Book <span>Factory</span></div>
      <span class="live" title="El panel se actualiza solo"><span class="dot" id="liveDot"></span><span id="liveTxt">Conectando…</span></span>
      <span class="avatar sm" id="meAvatar" title=""></span>
      <button class="btn ghost small" id="logout">Salir</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="today">🏠 Hoy</button>
      <button data-t="library">📚 Librería</button>
      <button data-t="chat">💬 Chat</button>
      <button data-t="more">⚙️ Más</button>
    </nav>
  </header>
  <main id="view"></main>
</section>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
let S = null, ME = null, TAB = "today", PROFILE = null, CHAT_TO = "factory", CHAT_BOOK = "", SEARCH = "", OPEN_BOOK = null;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

// ---------- words
const STEP_DOING = {RESEARCH:"está investigando el mercado para",BRIEF:"está preparando el plan de",WRITE:"está escribiendo",TRANSLATE:"está traduciendo",EDIT:"está editando",FACT_CHECK:"está comprobando los datos de",METADATA:"está creando el título y la descripción de",DESIGN:"está diseñando la portada de",FORMAT:"está maquetando",QC:"está revisando la calidad de",FIX:"está corrigiendo"};
const STEP_NAME = {RESEARCH:"Investigación",BRIEF:"Plan del libro",WRITE:"Escritura",TRANSLATE:"Traducción",EDIT:"Edición",FACT_CHECK:"Comprobación de datos",METADATA:"Título y descripción",DESIGN:"Portada",FORMAT:"Maquetación",QC:"Control de calidad",FIX:"Corrección"};
const SHELVES = [["review","Esperan vuestra revisión","Están terminados. Solo falta que digáis sí o no."],["ready","Listos para publicar","Aprobados. Solo queda subirlos a Amazon."],["production","En producción","Los agentes están trabajando en ellos."],["ideas","Ideas","Empezarán cuando haya hueco."],["published","Publicados",""],["stopped","Parados","Necesitan ayuda: mira el motivo dentro."],["discarded","Descartados",""]];
const STATUS_SENTENCE = s => ({IDEA:"Es una idea. Empezará cuando haya hueco.",RESEARCH_PENDING:"En cola para investigar.",RESEARCHING:"Investigando el mercado.",RESEARCH_COMPLETE:"Investigación hecha, falta el plan.",BRIEFING:"Preparando el plan del libro.",BRIEF_READY:"El plan está listo.",WRITING_PENDING:"En cola para escribir.",WRITING:"Escribiéndose.",DRAFT_COMPLETE:"Borrador terminado, falta editarlo.",TRANSLATION_PENDING:"En cola para traducir.",TRANSLATING:"Traduciéndose.",TRANSLATED:"Traducido, falta editarlo.",EDITING:"Editándose.",EDITED:"Editado, faltan los datos.",FACT_CHECKING:"Comprobando los datos.",FACT_CHECKED:"Datos comprobados.",METADATA_IN_PROGRESS:"Creando título y descripción.",DESIGN_PENDING:"En cola para la portada.",DESIGNING:"Diseñando la portada.",DESIGN_COMPLETE:"Portada hecha, falta maquetar.",FORMATTING:"Maquetando EPUB y PDF.",QC_PENDING:"En cola para el control de calidad.",QC:"En control de calidad.",QC_FAILED:"El control de calidad encontró fallos; se van a corregir.",FIXING:"Corrigiendo fallos.",QC_PASSED:"Ha pasado el control de calidad.",HUMAN_REVIEW:"Terminado. Os toca revisarlo.",CHANGES_REQUIRED:"Pedisteis cambios.",APPROVED:"Aprobado.",REJECTED:"Descartado.",READY_FOR_PUBLISHING:"Listo para subir a Amazon.",PUBLISHED:"Publicado.",BLOCKED:"Parado: necesita ayuda."}[s]||s);
const EVENT_TXT = e => { const b = e.book_id ? bookTitle(e.book_id) : "";
  switch(e.type){
    case "TASK_DONE": return `${e.agent} terminó: ${STEP_NAME[e.step]||e.step} de «${b}»`;
    case "TASK_CLAIMED": return `${e.agent} empezó: ${STEP_NAME[e.step]||e.step} de «${b}»`;
    case "TASK_FAILED": return `Un paso de «${b}» falló y se reintentará`;
    case "TASK_BLOCKED": return `«${b}» se ha parado y necesita ayuda`;
    case "PACKAGE_READY": return `«${b}» está listo para publicar`;
    case "BOOK_CREATED": return `Nueva idea: «${e.topic||b}»`;
    case "HUMAN_DECISION": return `${nameOf(e.by)} ${({APPROVE:"aprobó",REJECT:"descartó",REQUEST_CHANGES:"pidió cambios en"})[e.decision]||e.decision} «${b}»`;
    default: return null; } };
const nameOf = id => (S && S.names[id]) || id;
const bookTitle = id => { const b = S && S.books.find(x=>x.id===id); return b ? b.title : id; };
const ago = ts => { if(!ts) return ""; const s = (Date.now()-new Date(ts))/1000; if(s<60) return "ahora"; if(s<3600) return `hace ${Math.floor(s/60)} min`; if(s<86400) return `hace ${Math.floor(s/3600)} h`; return new Date(ts).toLocaleDateString("es-ES",{day:"numeric",month:"short"}); };
const hhmm = ts => new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const initials = n => String(n||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
function coverHTML(b, tag){
  const hue = [...b.id].reduce((a,c)=>a+c.charCodeAt(0),0) % 360;
  return `<div class="cover">${b.has_cover?`<img loading="lazy" alt="" src="/files/BOOKS/${encodeURIComponent(b.id)}/design/cover.png?v=${encodeURIComponent(b.updated_at)}">`:
    `<div class="ph" style="background:linear-gradient(160deg,hsl(${hue} 32% 38%),hsl(${(hue+40)%360} 30% 24%))">${esc(b.title)}</div>`}${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>`;
}
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?6500:3000); }

// ---------- api
async function api(url, body){
  const r = await fetch(url, body ? {method:"POST",headers:{"Content-Type":"application/json","X-EBF":"1"},body:JSON.stringify(body),credentials:"same-origin"} : {credentials:"same-origin"});
  if(r.status === 401){ showLogin(); throw new Error("Inicia sesión"); }
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("Error "+r.status));
  return d;
}
async function act(payload, btn, okMsg){
  if(btn) btn.disabled = true;
  try { const d = await api("/api/action", payload); toast(okMsg || "Hecho"); await load(); return d; }
  catch(e){ toast(e.message, true); return null; }
  finally { if(btn) btn.disabled = false; }
}

// ---------- login
async function boot(){
  const me = await fetch("/api/me").then(r=>r.json());
  if(me.partner){ ME = me; startApp(); } else { showLogin(me); }
}
async function showLogin(me){
  me = me || await fetch("/api/me").then(r=>r.json());
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); closeModal();
  $("#profiles").innerHTML = me.profiles.map(p=>`<div class="card profile" data-p="${esc(p.id)}" data-has="${p.has_pin?1:0}" data-name="${esc(p.name)}">
    <div class="avatar">${esc(initials(p.name))}</div><div style="font-weight:650;font-size:18px;margin-top:10px">${esc(p.name)}</div>
    <div class="tiny mut">${p.has_pin?"Entrar":"Primera vez"}</div></div>`).join("");
  document.querySelectorAll(".profile").forEach(el=>el.onclick=()=>{
    document.querySelectorAll(".profile").forEach(x=>x.classList.remove("sel")); el.classList.add("sel");

async function doLogin(){
  if(!PROFILE) return;
  const btn = $("#loginBtn"); btn.disabled = true;
  try { await api("/api/login",{partner:PROFILE.id,pin:$("#pin").value,name:$("#loginName").value}); ME = await fetch("/api/me").then(r=>r.json()); startApp(); }
  catch(e){ toast(e.message, true); $("#pin").select(); }
  finally { btn.disabled = false; }
}
$("#loginBtn").onclick = doLogin;
$("#pin").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("#logout").onclick = async ()=>{ await api("/api/logout",{}).catch(()=>{}); ME=null; S=null; if(window._es) window._es.close(); showLogin(); };

// ---------- app shell
function startApp(){
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#meAvatar").textContent = initials(ME.name); $("#meAvatar").title = ME.name;
  TAB = store.get("ebf_tab") || "today";
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
  load(); connectLive();
}
function go(t){ TAB=t; store.set("ebf_tab",t); render(); window.scrollTo(0,0); }
function connectLive(){
  if(window._es) window._es.close();
  const es = new EventSource("/api/stream"); window._es = es;
  es.onopen = ()=>{ $("#liveDot").classList.add("on"); $("#liveTxt").textContent = "En directo"; };
  es.onmessage = ()=> load(true);
  es.onerror = ()=>{ $("#liveDot").classList.remove("on"); $("#liveTxt").textContent = "Reconectando…"; };
}
setInterval(()=>{ if(ME) load(true); }, 45000);

function typing(){
  const a = document.activeElement;
  if(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName)) return true;
  return [...document.querySelectorAll("#view textarea, #sheet textarea, #sheet input[type=text]")].some(el=>el.value.trim());
}
async function load(soft){
  try { S = await api("/api/state"); }
  catch(e){ return; }
  if(soft && typing()){ renderTabs(); if(TAB==="chat") renderMessages(); return; }
  render();
  if(OPEN_BOOK && !$("#modal").classList.contains("hidden") && !typing()) openBook(OPEN_BOOK, true);
}
function unread(){ const seen = store.get("ebf_chat_seen") || ""; return S.chat.filter(m=>m.ts>seen && m.from!==S.me && m.role!=="system").length; }
function renderTabs(){
  document.querySelectorAll("#tabs button").forEach(b=>{
    b.classList.toggle("on", b.dataset.t===TAB);
    const base = {today:"🏠 Hoy",library:"📚 Librería",chat:"💬 Chat",more:"⚙️ Más"}[b.dataset.t];
    const n = b.dataset.t==="today" ? S.attention.length : b.dataset.t==="chat" && TAB!=="chat" ? unread() : 0;
    b.innerHTML = base + (n?`<span class="badge">${n}</span>`:"");
  });
}
function render(){ if(!S) return; renderTabs(); ({today:vToday,library:vLibrary,chat:vChat,more:vMore})[TAB](); }

function vToday(){
  const h = new Date().getHours(), hello = h<13?"Buenos días":h<20?"Buenas tardes":"Buenas noches";
  const cnt = k => S.books.filter(b=>b.shelf===k).length;
  const live = S.live.map(w=>{
    const pct = w.words && w.target ? Math.min(100, Math.round(w.words/w.target*100)) : null;
    return `<div class="card worker"><div class="avatar bot">🤖</div><div class="what">
      <div><b>${esc(w.agent)}</b> ${esc(STEP_DOING[w.step]||w.step)} <b>«${esc(w.title)}»</b></div>
      <div class="small mut">Empezó ${ago(w.started_at)}${w.words!=null?` · ${w.words.toLocaleString("es-ES")}${w.target?` de ${w.target.toLocaleString("es-ES")}`:""} palabras`:""}</div>
      ${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}</div></div>`; }).join("");
  const need = S.attention.map(a=>{
    if(a.kind==="review") return `<div class="card need"><div class="txt"><b>«${esc(a.title)}» está terminado.</b><div class="small mut">Revisadlo y decidid si se publica.</div></div><button class="btn primary" onclick="openBook('${a.book_id}')">Revisar</button></div>`;
    if(a.kind==="brief") return `<div class="card need"><div class="txt"><b>El plan de «${esc(a.title)}» necesita vuestro visto bueno.</b><div class="small mut">Es un tema delicado (salud, dinero, leyes…).</div></div><button class="btn primary" onclick="openBook('${a.book_id}')">Ver plan</button></div>`;
    if(a.kind==="question") return `<div class="card need"><div class="txt"><b>${esc(a.by)} pregunta:</b> ${esc(a.question)}
      <div class="opts">${a.options.map(o=>`<button class="btn" onclick='answerQ(${JSON.stringify(a.decision_id)},${esc(JSON.stringify(o))},this)'>${esc(o)}</button>`).join("")}<button class="btn ghost" onclick="go('chat')">Responder en el chat</button></div></div></div>`;
    if(a.kind==="blocked") return `<div class="card need hot"><div class="txt"><b>«${esc(bookTitle(a.book_id))}» se ha parado</b> en ${esc(STEP_NAME[a.step]||a.step)}.<div class="small mut">${esc(a.error)}</div></div><button class="btn" onclick="unblock('${a.task_id}',this)">Volver a intentarlo</button></div>`;
    return "";
  }).join("");
  const feed = S.events.map(e=>({e,t:EVENT_TXT(e)})).filter(x=>x.t).slice(0,8);
  $("#view").innerHTML = `
    <h1>${hello}, ${esc(nameOf(S.me))}</h1>
    <div class="mut">${S.live.length?`Ahora mismo ${S.live.length===1?"hay 1 agente trabajando":`hay ${S.live.length} agentes trabajando`}.`:"La fábrica está en pausa: ningún agente trabajando ahora mismo."}</div>
    <h2>Ahora mismo</h2>
    <div class="now">${live || `<div class="card"><b>Ningún agente está trabajando.</b> <span class="mut">${S.queue?`Hay ${S.queue} ${S.queue===1?"tarea esperando":"tareas esperando"}.`:"No hay tareas en cola."}</span>
      <div class="small mut" style="margin-top:6px">Los agentes son sesiones de Claude. <a href="#" onclick="go('more');return false">Cómo encender uno</a></div></div>`}</div>
    <h2>Te necesitamos</h2>
    <div class="now">${need || `<div class="card mut">Nada pendiente. Todo está en manos de los agentes. 👌</div>`}</div>
    <h2>Vuestros libros</h2>
    <div class="counts">
      ${[["review","Para revisar"],["production","En producción"],["ready","Listos para publicar"],["published","Publicados"]].map(([k,l])=>`<button class="card count" onclick="go('library')"><div class="n">${cnt(k)}</div><div class="small mut">${l}</div></button>`).join("")}
    </div>
    <h2>Lo último que ha pasado</h2>
    <div class="card feed">${feed.map(x=>`<div class="it"><span class="when">${ago(x.e.ts)}</span><span>${esc(x.t)}</span></div>`).join("") || `<div class="empty">Todavía no ha pasado nada.</div>`}</div>`;
}

function vChatChips(){
  const c = $("#chips"); if(!c) return;
  const sug = CHAT_TO==="factory" ? ["¿Cómo va todo?","Busca 3 ideas de libros nuevos","¿Qué libro va más avanzado?","Prioriza los libros en español"] : ["¿Lo revisamos hoy?","He aprobado un libro","Hablamos en la reunión"];
  c.innerHTML = sug.map(s=>`<button class="chip">${esc(s)}</button>`).join("");
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ $("#msg").value = b.textContent; $("#msg").focus(); });
}
function renderMessages(scroll){
  const box = $("#msgs"); if(!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const items = S.chat.map(m=>({ts:m.ts, m}));
  S.events.forEach(e=>{ const t = ["TASK_DONE","PACKAGE_READY","TASK_BLOCKED","BOOK_CREATED","HUMAN_DECISION"].includes(e.type) ? EVENT_TXT(e) : null; if(t) items.push({ts:e.ts, ev:t}); });
  items.sort((a,b)=>a.ts<b.ts?-1:1);
  let lastDay = "", html = "";
  for(const it of items.slice(-250)){
    const day = new Date(it.ts).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
    if(day!==lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    if(it.ev){ html += `<div class="ev">· ${esc(it.ev)} · ${hhmm(it.ts)}</div>`; continue; }
    const m = it.m;
    if(m.role==="system"){ html += `<div class="sys">${esc(m.text)}</div>`; continue; }
    const mine = m.from===S.me, cls = mine ? "me" : m.role;
    const who = m.role==="agent" ? `🤖 ${m.from}` : nameOf(m.from);
    const to = m.role==="partner" && m.to && m.to!=="factory" ? ` → ${nameOf(m.to)}` : m.role==="partner" && m.to==="factory" ? " → agente jefe" : "";
    const about = m.book_id ? ` · sobre «${bookTitle(m.book_id)}»` : "";
    const prog = m.kind==="progress" ? "📈 " : m.kind==="question" ? "❓ " : "";
    html += `<div class="m ${cls}">${mine?"":`<div class="avatar sm ${m.role==="agent"?"bot":""}">${m.role==="agent"?"🤖":esc(initials(nameOf(m.from)))}</div>`}
      <div><div class="who">${esc(who)}${esc(to)}</div><div class="bub">${prog}${esc(m.text)}${m.open&&m.options.length?`<div class="opts">${m.options.map(o=>`<button class="btn" onclick='answerQ(${JSON.stringify(m.decision_id)},${esc(JSON.stringify(o))},this)'>${esc(o)}</button>`).join("")}</div>`:""}</div>
      <div class="meta">${hhmm(m.ts)}${esc(about)}</div></div></div>`;
  }
  box.innerHTML = html || `<div class="sys">Aquí hablaréis con el agente jefe y entre vosotros. Prueba: «¿Cómo va todo?»</div>`;
  if(scroll || atBottom) box.scrollTop = box.scrollHeight;
  const pend = S.pending_orders.filter(o=>o.chat_msg).length;
  const w = $("#waiting"); if(w) w.textContent = pend ? `⏳ ${pend} ${pend===1?"mensaje esperando":"mensajes esperando"} respuesta de un agente${S.live.length?"":" (ningún agente encendido ahora mismo)"}` : "";
  if(S.chat.length) store.set("ebf_chat_seen", S.chat[S.chat.length-1].ts);
  renderTabs();
}
async function sendMsg(){
  const t = $("#msg"), text = t.value.trim(); if(!text) return;
  const btn = $("#send"); btn.disabled = true;
  try { await api("/api/action",{action:"chat_send",text,to:CHAT_TO,book:$("#aboutBook").value}); t.value=""; await load(); renderMessages(true); }
  catch(e){ toast(e.message,true); }
  finally { btn.disabled = false; }
}

// ---------- MÁS
function vMore(){
  const prompt = id => `Trabaja como agente ${id} de la E-Book Factory siguiendo PROMPTS/WORKER.md`;
  const st = a => a.status==="BUSY" ? ["busy","Trabajando"] : (a.minutes_ago!=null && a.minutes_ago>180) || a.status==="OFFLINE" ? ["off","Apagado"] : ["idle","Libre"];
  const sy = S.sync;
  $("#view").innerHTML = `<h1>Más</h1>
    <h2>Los agentes</h2>
    <div class="agents">${S.agents.map(a=>{ const [c,l]=st(a); const w=S.live.find(x=>x.agent===a.agent_id); return `<div class="card">
      <div style="display:flex;gap:10px;align-items:center"><div class="avatar bot sm">🤖</div><div style="flex:1"><b>${esc(a.agent_id)}</b><div class="tiny mut">de ${esc(nameOf(a.owner))}${a.agent_id===S.main_agent?" · agente jefe":""}</div></div><span class="status ${c}">${l}</span></div>
      <div class="small mut" style="margin-top:8px">${w?`${esc(STEP_DOING[w.step]||w.step)} «${esc(w.title)}»`:`Visto ${ago(a.last_seen)}`}</div>
      <button class="btn small" style="margin-top:10px" onclick='copyTxt(${esc(JSON.stringify(prompt(a.agent_id)))})'>Copiar frase para encenderlo</button></div>`; }).join("") || `<div class="card mut">Todavía no hay agentes registrados.</div>`}</div>
    <h2>Cómo se enciende un agente</h2>
    <div class="card"><ol class="steps">
      <li>Abre <b>Claude Code</b> en la carpeta del proyecto (la misma donde está <code>ABRIR_PANEL.bat</code>).</li>
      <li>Pega la frase del agente (botón <i>Copiar frase</i>) y pulsa Enter.</li>
      <li>El agente lee el chat, responde lo pendiente y se pone a fabricar libros. Lo verás aquí en directo. Para cuando acaba la cola o tras 12 tareas.</li>
      <li><b>Para que trabaje solo con horario</b> (p. ej. cada 3 horas, también de noche): pídeselo a Claude con «programa el agente ${esc(S.main_agent)} cada 3 horas».</li>
    </ol><div class="small mut" style="margin-top:10px"><b>Dani</b> hace lo mismo en su ordenador con su agente (DANI-AGENT-001). Primera vez, en su carpeta: <code class="copy">python factory.py agent register --id DANI-AGENT-001 --owner DANI --model claude</code></div></div>
    <h2>Sincronización con GitHub</h2>
    <div class="card"><div>${sy.enabled?`Estado: <b>${sy.result==="OK"?"al día":esc(sy.result)}</b> · última vez ${ago(sy.at)}`:"Desactivada (este panel no comparte cambios)."}</div>
      <div class="small mut">El panel sube y baja los cambios cada minuto. Así ves lo que hace ${esc(nameOf(Object.keys(S.names).find(p=>p!==S.me)))} y sus agentes.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="bSync">Sincronizar ahora</button>
      <button class="btn" id="bTick" title="Recupera trabajos cortados, prepara las siguientes tareas, maqueta lo que esté listo y actualiza los informes">Poner la fábrica al día</button></div></div>
    <h2>Mi cuenta</h2>
    <div class="card"><div class="decide"><div><label>Mi nombre</label><div style="display:flex;gap:8px"><input id="myName" type="text" value="${esc(nameOf(S.me))}"><button class="btn" id="bName">Guardar</button></div></div>
      <div><label>Cambiar PIN</label><div style="display:flex;gap:8px"><input id="pinOld" type="password" inputmode="numeric" placeholder="Actual"><input id="pinNew" type="password" inputmode="numeric" placeholder="Nuevo"><button class="btn" id="bPin">Cambiar</button></div></div></div></div>
    <h2>Todo lo que ha pasado</h2>
    <div class="card" style="overflow-x:auto"><table>${S.events.map(e=>({e,t:EVENT_TXT(e)})).filter(x=>x.t).map(x=>`<tr><td class="mut" style="white-space:nowrap">${ago(x.e.ts)}</td><td>${esc(x.t)}</td></tr>`).join("") || `<tr><td class="empty">Nada todavía</td></tr>`}</table></div>`;
  $("#bSync").onclick = e=>act({action:"sync"}, e.target, "Sincronizado");
  $("#bTick").onclick = e=>act({action:"tick"}, e.target, "Fábrica al día");
  $("#bName").onclick = e=>act({action:"set_name",name:$("#myName").value}, e.target, "Nombre guardado").then(async()=>{ ME = await fetch("/api/me").then(r=>r.json()); $("#meAvatar").textContent = initials(ME.name); });
  $("#bPin").onclick = async e=>{ if(await act({action:"change_pin",old:$("#pinOld").value,new:$("#pinNew").value}, e.target, "PIN cambiado")){ $("#pinOld").value=""; $("#pinNew").value=""; } };
}
function copyTxt(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("Copiado. Pégalo en Claude Code"), ()=>window.prompt("Copia esto:", t)); }

boot();
</script>
