<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Cover template "stack": horizontal color blocks, good for series/collections. Variables: {{bg}} {{fg}} {{accent}} {{muted}} */
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
body{background:{{bg}};color:{{fg}};font-family:Georgia,"Times New Roman",serif;position:relative}
.blocks{position:absolute;left:0;right:0;top:0;height:1000px;display:flex;flex-direction:column}
.blocks div{flex:1}
.b1{background:{{accent}}}.b2{background:{{accent}};opacity:.7}.b3{background:{{accent}};opacity:.45}.b4{background:{{accent}};opacity:.2}
.badge{position:absolute;right:130px;top:880px;width:240px;height:240px;border-radius:50%;background:{{fg}};color:{{bg}};display:flex;align-items:center;justify-content:center;text-align:center;font:700 40px/1.1 "Segoe UI",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.title{position:absolute;left:130px;right:130px;top:1230px;font-weight:700;line-height:1.02}
.title span{display:block;font-size:190px}
.sub{position:absolute;left:130px;right:200px;top:1820px;font-size:62px;line-height:1.3;font-style:italic;opacity:.9}
.author{position:absolute;left:130px;bottom:150px;font:600 54px "Segoe UI",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:{{muted}}}
</style></head><body>
<div class="blocks"><div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="b4"></div></div>
<div class="badge">{{badge}}</div>
<div class="title"><span>{{title_line1}}</span><span>{{title_line2}}</span></div>
<div class="sub">{{subtitle}}</div>
<div class="author">{{author}}</div>
</body></html>
